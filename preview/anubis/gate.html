<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirage gate prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #060607; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px;
         justify-content: center; padding: 10px; direction: rtl; font: 13px system-ui, sans-serif; }
  .bar button, .bar select { background: #151313; color: #EDE6E3; border: 1px solid #3a2226; border-radius: 18px;
         padding: 7px 14px; font: inherit; cursor: pointer; }
  .bar button[aria-pressed='true'] { border-color: #C21C2E; background: #2a1215; }
  .hud { position: fixed; top: 8px; left: 8px; color: #8C8481; font: 11px ui-monospace, monospace; direction: ltr; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud"></div>
<div class="bar">
  <button data-st="off" aria-pressed="true">قطع</button>
  <button data-st="busy" aria-pressed="false">در حال اتصال</button>
  <button data-st="on" aria-pressed="false">وصل</button>
  <button data-st="fail" aria-pressed="false">وصل نشد</button>
  <select id="dest" aria-label="کشور مقصد">
    <option value="nl">هلند</option><option value="de">آلمان</option><option value="tr">ترکیه</option>
    <option value="us">آمریکا</option><option value="jp">ژاپن</option><option value="gb">بریتانیا</option>
  </select>
</div>
<script src="/app/three.min.js"></script>
<script src="/app/gsap.min.js"></script>
<script>
'use strict';
/* Mirage, the gate (a prototype; nothing here is in the app yet).

   A temple pylon at night. The origin country's flag hangs across the
   gateway as a cloth banner; two Anubis guardians, built from plain shapes
   after the reference sheet beside this file, cross their spears in front of
   it. Connecting, the Mirage sun rises in the notch between the towers;
   connected, the banner comes loose and falls, the guardians pull their
   spears upright, and the destination's flag unrolls from the lintel.

   Light on purpose: everything is a few primitives with flat shading (no
   models to download), one cloth of 24 x 14 points stepped on the CPU, Phong
   materials, no shadows, no post-processing. The HUD says what a frame costs. */
const T = window.THREE;
const D = Math.PI / 180;
const canvas = document.getElementById('c');
const ratio = Number(new URLSearchParams(location.search).get('dpr')) || Math.min(devicePixelRatio || 1, 1.75);
const renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'low-power' });
renderer.setPixelRatio(ratio);
const scene = new T.Scene();
scene.background = new T.Color(0x060607);
scene.fog = new T.Fog(0x060607, 9, 22);
const camera = new T.PerspectiveCamera(40, 1, 0.1, 60);
const home = { x: 0, y: 1.75, z: 8.6, ly: 1.75 };
const view = { ...home };

/* ---------------------------------------------------------------- materials */
const flat = (color, extra) => new T.MeshPhongMaterial({ color, flatShading: true, shininess: 18, ...extra });
const stone = flat(0x121011, { specular: 0x2a2224, shininess: 30 });
const gold = flat(0xB8963E, { specular: 0xffe0a0, shininess: 60 });
const red = flat(0xA3141F, { specular: 0x401015 });
const wall = flat(0x1a1513, { specular: 0x0a0808, shininess: 6 });
function stripes(colors, n, vertical) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  for (let i = 0; i < n; i += 1) {
    g.fillStyle = colors[i % colors.length];
    if (vertical) g.fillRect(i * 64 / n, 0, 64 / n + 1, 64); else g.fillRect(0, i * 64 / n, 64, 64 / n + 1);
  }
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace;
  t.wrapS = t.wrapT = T.RepeatWrapping; return t;
}
const nemes = flat(0xffffff, { map: stripes(['#A3141F', '#121011', '#B8963E', '#121011'], 12, false) });
const pleat = flat(0xffffff, { map: stripes(['#121011', '#1e1a1b', '#121011', '#6E0D16'], 24, true), side: T.DoubleSide });
const collarMat = flat(0xffffff, { map: stripes(['#B8963E', '#121011', '#A3141F', '#121011'], 8, false), side: T.DoubleSide });

/* --------------------------------------------------------------- the ground */
{
  const geo = new T.PlaneGeometry(40, 40, 24, 24);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i += 1) {
    const x = p.getX(i), y = p.getY(i), far = Math.max(0, y - 3);
    p.setZ(i, Math.sin(x * 0.35) * Math.cos(y * 0.3) * 0.25 * Math.min(1, far / 4));
  }
  geo.rotateX(-Math.PI / 2); geo.computeVertexNormals();
  scene.add(new T.Mesh(geo, flat(0x14100d, { shininess: 2 })));
  // a few stars
  const pts = [];
  for (let i = 0; i < 260; i += 1) {
    const a = Math.random() * Math.PI * 2, e = 0.12 + Math.random() * 1.2;
    pts.push(Math.cos(a) * 30 * Math.cos(e), 30 * Math.sin(e), -Math.abs(Math.sin(a) * 30 * Math.cos(e)) - 4);
  }
  const sg = new T.BufferGeometry(); sg.setAttribute('position', new T.Float32BufferAttribute(pts, 3));
  scene.add(new T.Points(sg, new T.PointsMaterial({ color: 0xcfc6bc, size: 0.06, fog: false })));
}

/* ----------------------------------------------------------------- the gate */
const mesh = (geo, mat, x, y, z, parent) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); (parent || scene).add(m); return m; };
function frustum(wb, wt, h, d) {
  const g = new T.CylinderGeometry(wt / Math.SQRT2, wb / Math.SQRT2, h, 4, 1);
  g.rotateY(Math.PI / 4); g.scale(1, 1, d / wb); return g;
}
const LINTEL = 2.5, OPEN = 0.66;
for (const s of [-1, 1]) {
  mesh(frustum(1.9, 1.5, 3.9, 1.0), wall, s * 1.72, 1.95, 0);
  mesh(new T.BoxGeometry(1.62, 0.16, 0.86), wall, s * 1.72, 3.98, 0);           // cornice
  mesh(new T.BoxGeometry(1.66, 0.04, 0.9), gold, s * 1.72, 3.88, 0);
  for (const y of [1.0, 2.2]) mesh(new T.BoxGeometry(1.5 - y * 0.05, 0.025, 0.02), red, s * 1.72, y, 0.5 - y * 0.035);
  mesh(new T.BoxGeometry(0.16, LINTEL, 0.5), wall, s * (OPEN + 0.08), LINTEL / 2, 0.1);  // jambs
}
mesh(new T.BoxGeometry(1.7, 0.5, 0.56), wall, 0, LINTEL + 0.25, 0.1);                   // lintel
mesh(new T.BoxGeometry(1.76, 0.05, 0.6), gold, 0, LINTEL + 0.52, 0.1);
// the winged sun over the door
mesh(new T.CylinderGeometry(0.12, 0.12, 0.03, 16).rotateX(Math.PI / 2), gold, 0, LINTEL + 0.26, 0.4);
for (const s of [-1, 1]) {
  const w = new T.Shape(); w.moveTo(0, 0.05); w.lineTo(0.62, 0.11); w.lineTo(0.55, -0.02); w.lineTo(0, -0.06);
  const m = mesh(new T.ShapeGeometry(w), gold, s * 0.14, LINTEL + 0.26, 0.39);
  if (s < 0) m.scale.x = -1;
}
// the dark doorway
mesh(new T.PlaneGeometry(OPEN * 2, LINTEL), flat(0x050404), 0, LINTEL / 2, -0.12);

/* ----------------------------------------------------- the sun of Mirage */
function eyeTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.translate(128, 128); g.scale(256 / 120, 256 / 120); g.translate(-60, -60);
  g.fillStyle = '#0A0909'; g.beginPath(); g.arc(60, 60, 58, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#A3141F'; g.lineWidth = 2; g.stroke();
  g.lineCap = 'round';
  g.lineWidth = 4; g.beginPath(); g.moveTo(22, 60); g.quadraticCurveTo(60, 20, 98, 60); g.stroke();
  g.strokeStyle = '#6E0D16'; g.lineWidth = 3; g.setLineDash([1.5, 4.5]);
  g.beginPath(); g.moveTo(22, 60); g.quadraticCurveTo(60, 100, 98, 60); g.stroke();
  g.strokeStyle = '#A3141F'; g.setLineDash([0.9, 3.03]); g.beginPath(); g.arc(60, 60, 15, 0, Math.PI * 2); g.stroke();
  g.setLineDash([]); g.lineWidth = 1.4; g.beginPath(); g.arc(60, 60, 11.5, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#A3141F'; g.beginPath(); g.arc(60, 60, 6, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#0A0909'; g.fillRect(44, 59.4, 32, 1.2);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t;
}
const sun = new T.Group();
sun.position.set(0, LINTEL - 0.05, -0.3);
scene.add(sun);
const SUN_R = 0.42;
mesh(new T.CircleGeometry(SUN_R, 40), new T.MeshBasicMaterial({ map: eyeTexture(), transparent: true }), 0, 0, 0, sun);
const bead = new T.Group(); sun.add(bead);
mesh(new T.CircleGeometry(SUN_R * 0.04, 12), new T.MeshBasicMaterial({ color: 0xffffff }), SUN_R * 0.177, SUN_R * 0.177, 0.01, bead);
const glow = new T.PointLight(0xC21C2E, 0, 6, 1.6); glow.position.set(0, LINTEL + 0.4, 1.2); scene.add(glow);

/* ------------------------------------------------------------ the guardians */
/* After preview/anubis/reference-sheet.png: plinth, legs, pleated kilt, a
   wedge of a torso, the broad collar, the jackal head in its striped nemes,
   the inner hand forward on an upright spear. The spear turns about the
   hand; that is the whole rig. */
function guardian() {
  const g = new T.Group();
  const at = (geo, mat, x, y, z, parent) => mesh(geo, mat, x, y, z, parent || g);
  at(new T.BoxGeometry(0.82, 0.2, 0.62), stone, 0, 0.1, 0);
  at(new T.BoxGeometry(0.84, 0.035, 0.64), red, 0, 0.165, 0);
  at(new T.BoxGeometry(0.86, 0.02, 0.66), gold, 0, 0.2, 0);
  for (const s of [-1, 1]) {
    at(new T.BoxGeometry(0.11, 0.06, 0.24), stone, s * 0.09, 0.24, 0.04);
    at(new T.CylinderGeometry(0.052, 0.042, 0.62, 6), stone, s * 0.09, 0.58, 0);
    at(new T.CylinderGeometry(0.056, 0.056, 0.03, 6), gold, s * 0.09, 0.33, 0);
  }
  at(new T.CylinderGeometry(0.2, 0.3, 0.36, 16, 1, true), pleat, 0, 1.0, 0);
  at(new T.CylinderGeometry(0.205, 0.205, 0.05, 12), gold, 0, 1.19, 0);
  at(new T.BoxGeometry(0.11, 0.3, 0.02), red, 0, 0.98, 0.27).rotation.x = -0.18;
  const torso = frustum(0.62, 0.36, 0.52, 0.32);
  at(torso, stone, 0, 1.47, 0);
  at(new T.CylinderGeometry(0.17, 0.33, 0.12, 16, 1, true), collarMat, 0, 1.68, 0);
  at(new T.CylinderGeometry(0.07, 0.08, 0.14, 6), stone, 0, 1.78, 0);
  // the head
  const head = new T.Group(); head.position.set(0, 1.92, 0); g.add(head);
  const skull = at(new T.IcosahedronGeometry(0.12, 0), stone, 0, 0, 0, head); skull.scale.set(1, 0.95, 1.12);
  const snout = at(new T.CylinderGeometry(0.022, 0.06, 0.27, 6), stone, 0, -0.035, 0.17, head);
  snout.rotation.x = Math.PI / 2 + 0.22;
  for (const s of [-1, 1]) {
    const ear = at(new T.ConeGeometry(0.048, 0.24, 4), stone, s * 0.065, 0.18, -0.03, head);
    ear.rotation.z = -s * 0.12;
    at(new T.BoxGeometry(0.03, 0.012, 0.012), gold, s * 0.05, 0.02, 0.105, head).rotation.z = s * 0.25;
    at(new T.BoxGeometry(0.075, 0.3, 0.05), nemes, s * 0.135, -0.2, 0.05, head);
  }
  at(new T.CylinderGeometry(0.14, 0.17, 0.12, 8), nemes, 0, 0.02, -0.03, head);
  at(new T.BoxGeometry(0.3, 0.36, 0.05), nemes, 0, -0.16, -0.13, head);
  // the arms; the inner one (toward +x) holds the spear forward
  const parts = {};
  for (const s of [-1, 1]) {
    const shoulder = new T.Group(); shoulder.position.set(s * 0.29, 1.62, 0); g.add(shoulder);
    at(new T.CylinderGeometry(0.05, 0.044, 0.3, 6), stone, 0, -0.15, 0, shoulder);
    at(new T.CylinderGeometry(0.053, 0.053, 0.04, 6), gold, 0, -0.08, 0, shoulder);
    const elbow = new T.Group(); elbow.position.set(0, -0.3, 0); shoulder.add(elbow);
    at(new T.CylinderGeometry(0.043, 0.036, 0.28, 6), stone, 0, -0.14, 0, elbow);
    at(new T.CylinderGeometry(0.04, 0.04, 0.04, 6), gold, 0, -0.24, 0, elbow);
    at(new T.BoxGeometry(0.06, 0.08, 0.05), stone, 0, -0.3, 0, elbow);
    if (s > 0) { elbow.rotation.x = -1.35; parts.elbow = elbow; }
  }
  // where the inner hand is, in the guardian's own space
  const hand = new T.Vector3(0.29, 1.62 - 0.3 - 0.3 * Math.cos(1.35), 0.3 * Math.sin(1.35));
  const spear = new T.Group(); spear.position.copy(hand); g.add(spear);
  at(new T.CylinderGeometry(0.014, 0.014, 2.6, 6), stone, 0, 0.25, 0, spear);
  at(new T.ConeGeometry(0.04, 0.2, 6), gold, 0, 1.65, 0, spear);
  at(new T.CylinderGeometry(0.024, 0.024, 0.06, 6), gold, 0, 1.53, 0, spear);
  at(new T.CylinderGeometry(0.02, 0.012, 0.08, 6), gold, 0, -1.07, 0, spear);
  parts.spear = spear;
  return { g, ...parts };
}
const guards = [-1, 1].map((s) => {
  const it = guardian();
  it.g.position.set(s * 1.08, 0, 1.05);
  it.g.scale.set(-s, 1, 1);          // the right one is the left one mirrored
  it.g.rotation.y = -s * 22 * D;     // turned a little toward the door, so the snouts read in profile
  if (s > 0) it.spear.position.z += 0.025;   // so the crossed shafts do not cut each other
  scene.add(it.g);
  return it;
});
const CROSS = 38 * D;
function spears(angle, lift) {
  const a = 1.35 + lift * 0.25;
  guards.forEach((it, k) => {
    it.spear.rotation.z = -angle;
    it.elbow.rotation.x = -a;
    // the spear stays in the hand as the forearm comes up
    it.spear.position.set(0.29, 1.32 - 0.3 * Math.cos(a), 0.3 * Math.sin(a) + (k ? 0.025 : 0) - lift * 0.08);
  });
}
const pose = { cross: 1, lift: 0 };
const poseNow = () => spears(CROSS * pose.cross, pose.lift);
poseNow();

/* ------------------------------------------------------------------- flags */
const flagCache = new Map();
function flagTexture(code) {
  if (flagCache.has(code)) return flagCache.get(code);
  const c = document.createElement('canvas'); c.width = 512; c.height = 340;
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 4;
  const img = new Image();
  img.onload = () => { c.getContext('2d').drawImage(img, 0, 0, 512, 340); t.needsUpdate = true; };
  img.src = `/app/flags/${code === 'gb' ? 'uk' : code}.svg`;
  flagCache.set(code, t);
  return t;
}

/* ---------------------------------------------------- the banner: a cloth */
const NX = 24, NY = 14, BW = 1.24, BH = 0.82;
const banner = new T.Group(); banner.position.set(0, LINTEL - 0.02, 0.42); scene.add(banner);
const clothGeo = new T.PlaneGeometry(BW, BH, NX - 1, NY - 1); clothGeo.translate(0, -BH / 2, 0);
const clothMat = new T.MeshPhongMaterial({ map: flagTexture('ir'), side: T.DoubleSide, shininess: 8, transparent: true });
const cloth = new T.Mesh(clothGeo, clothMat); banner.add(cloth);
const N = NX * NY, P = new Float32Array(N * 3), Q = new Float32Array(N * 3), pin = new Uint8Array(N);
const DX = BW / (NX - 1), DY = BH / (NY - 1), FLOOR = -(LINTEL - 0.02) + 0.01;
function clothReset(code) {
  clothMat.map = flagTexture(code); clothMat.opacity = 1; clothMat.needsUpdate = true;
  for (let r = 0; r < NY; r += 1) for (let c = 0; c < NX; c += 1) {
    const i = (r * NX + c) * 3;
    P[i] = Q[i] = -BW / 2 + c * DX; P[i + 1] = Q[i + 1] = -r * DY; P[i + 2] = Q[i + 2] = 0;
    pin[r * NX + c] = r === 0 ? 1 : 0;
  }
  cloth.visible = true;
}
clothReset('ir');
let wind = 0.4, clothT = 0;
function link(a, b, rest) {
  const ia = a * 3, ib = b * 3;
  const dx = P[ib] - P[ia], dy = P[ib + 1] - P[ia + 1], dz = P[ib + 2] - P[ia + 2];
  const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6, k = (d - rest) / d * 0.5;
  const wa = pin[a] ? 0 : 1, wb = pin[b] ? 0 : 1, w = wa + wb;
  if (!w) return;
  const fa = k * 2 * wa / w, fb = k * 2 * wb / w;
  P[ia] += dx * fa; P[ia + 1] += dy * fa; P[ia + 2] += dz * fa;
  P[ib] -= dx * fb; P[ib + 1] -= dy * fb; P[ib + 2] -= dz * fb;
}
function clothStep(dt) {
  clothT += dt;
  const gy = -9.8 * dt * dt, wz = (Math.sin(clothT * 1.7) * 0.6 + Math.sin(clothT * 3.1 + 1) * 0.4) * wind * dt * dt * 6;
  for (let i = 0; i < N; i += 1) {
    if (pin[i]) continue;
    const j = i * 3;
    for (let a = 0; a < 3; a += 1) {
      const v = (P[j + a] - Q[j + a]) * 0.985; Q[j + a] = P[j + a];
      P[j + a] += v + (a === 1 ? gy : a === 2 ? wz * (0.4 + (i % NX) / NX) : 0);
    }
  }
  for (let it = 0; it < 3; it += 1) {
    for (let r = 0; r < NY; r += 1) for (let c = 0; c < NX; c += 1) {
      const i = r * NX + c;
      if (c < NX - 1) link(i, i + 1, DX);
      if (r < NY - 1) link(i, i + NX, DY);
    }
  }
  for (let i = 0; i < N; i += 1) {
    const j = i * 3;
    if (P[j + 1] < FLOOR) { P[j + 1] = FLOOR; Q[j] = P[j]; Q[j + 2] = P[j + 2]; Q[j + 1] = FLOOR; }
  }
  clothGeo.attributes.position.array.set(P);
  clothGeo.attributes.position.needsUpdate = true;
  clothGeo.computeVertexNormals();
}
/* let it go: the left half of the rail first, then the right */
function release(tl, at) {
  for (let c = 0; c < NX; c += 1) {
    const late = c < NX / 2 ? c * 0.012 : 0.22 + (c - NX / 2) * 0.012;
    tl.add(() => { pin[c] = 0; }, at + late);
  }
}

/* ------------------------------------ the new banner: unrolls from a rod */
const roll = new T.Group(); banner.add(roll);
const unGeo = new T.BufferGeometry();
unGeo.setAttribute('position', new T.Float32BufferAttribute(new Float32Array(12), 3));
unGeo.setAttribute('uv', new T.Float32BufferAttribute(new Float32Array(8), 2));
unGeo.setIndex([0, 2, 1, 1, 2, 3]);
const unMat = new T.MeshPhongMaterial({ side: T.DoubleSide, shininess: 8 });
const unrolled = new T.Mesh(unGeo, unMat); roll.add(unrolled);
const rod = new T.Group(); roll.add(rod);
mesh(new T.CylinderGeometry(0.03, 0.03, BW + 0.04, 8).rotateZ(Math.PI / 2), stone, 0, 0, 0.01, rod);
for (const s of [-1, 1]) mesh(new T.SphereGeometry(0.04, 8, 6), gold, s * (BW / 2 + 0.04), 0, 0.01, rod);
const unroll = { h: 0 };
function unrollDraw() {
  const h = Math.max(0.0001, unroll.h * BH), p = unGeo.attributes.position, uv = unGeo.attributes.uv;
  p.setXYZ(0, -BW / 2, 0, 0); p.setXYZ(1, BW / 2, 0, 0); p.setXYZ(2, -BW / 2, -h, 0); p.setXYZ(3, BW / 2, -h, 0);
  uv.setXY(0, 0, 1); uv.setXY(1, 1, 1); uv.setXY(2, 0, 1 - h / BH); uv.setXY(3, 1, 1 - h / BH);
  p.needsUpdate = uv.needsUpdate = true; unGeo.computeVertexNormals(); unGeo.computeBoundingSphere();
  rod.position.y = -h;
  roll.visible = unroll.h > 0.001;
}
unrollDraw();

/* -------------------------------------------------------------- the story */
let state = 'off', tl = null, loops = [], dest = 'nl', shown = 'ir';
const killAll = () => { if (tl) tl.kill(); loops.forEach((l) => l.kill()); loops = []; };
function to(st) {
  if (st === state) return;
  const was = state; state = st;
  document.querySelectorAll('.bar button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.st === st)));
  killAll();
  tl = gsap.timeline({ defaults: { ease: 'power2.inOut' } });
  if (st === 'busy') {
    wind = 0.9;
    tl.to(sun.position, { y: LINTEL + 0.95, duration: 1.8, ease: 'power2.out' }, 0)
      .to(glow, { intensity: 2.2, duration: 1.2 }, 0);
    loops.push(gsap.to(bead.rotation, { z: '-=' + Math.PI * 2, duration: 0.6, ease: 'none', repeat: -1 }));
    loops.push(gsap.to(glow, { intensity: 1.2, duration: 0.8, yoyo: true, repeat: -1, ease: 'sine.inOut', delay: 1.2 }));
    loops.push(gsap.to(pose, { cross: 0.94, duration: 0.5, yoyo: true, repeat: -1, ease: 'sine.inOut', onUpdate: poseNow }));
    return;
  }
  if (st === 'on') {
    wind = 0.4;
    unMat.map = flagTexture(dest); unMat.needsUpdate = true;
    tl.to(sun.position, { y: LINTEL + 1.2, duration: 1.0, ease: 'power3.out' }, 0)
      .to(bead.rotation, { z: Math.ceil(bead.rotation.z / (Math.PI * 2)) * Math.PI * 2, duration: 0.8 }, 0)
      .to(glow, { intensity: 1.4, duration: 0.6 }, 0);
    release(tl, 0.25);
    tl.to(pose, { cross: 0, lift: 1, duration: 1.0, ease: 'power3.inOut', onUpdate: poseNow }, 0.7)
      .to(clothMat, { opacity: 0, duration: 0.6 }, 2.2)
      .set(unroll, { h: 0 }, 1.5)
      .to(unroll, { h: 1, duration: 1.2, ease: 'bounce.out', onUpdate: unrollDraw }, 1.6)
      .add(() => { clothReset(dest); roll.visible = false; unroll.h = 0; shown = dest; }, 2.85)
      .to(view, { z: 6.6, y: 1.6, ly: 1.7, duration: 2.6, ease: 'power2.inOut' }, 0.3);
    return;
  }
  // off or fail: the sun goes down, the spears cross again, the banner is the origin's
  wind = 0.4;
  if (st === 'fail') {
    tl.to(glow, { intensity: 4, duration: 0.08, yoyo: true, repeat: 3 }, 0);
    loops.push(gsap.fromTo(pose, { cross: 0.8 }, { cross: 1, duration: 0.09, yoyo: true, repeat: 5, onUpdate: poseNow }));
  }
  tl.to(sun.position, { y: LINTEL - 0.05, duration: 0.9, ease: 'power2.in' }, 0)
    .to(glow, { intensity: 0, duration: 0.6 }, 0.2)
    .to(pose, { cross: 1, lift: 0, duration: 0.8, onUpdate: poseNow }, st === 'fail' ? 0.6 : 0.4)
    .to(view, { ...home, duration: 1.4 }, 0);
  if (was === 'on' || shown !== 'ir') {
    // the destination's banner rolls up; the origin's unrolls back into place
    tl.add(() => { unMat.map = flagTexture(shown); unMat.needsUpdate = true; unroll.h = 1; unrollDraw(); cloth.visible = false; }, 0)
      .to(unroll, { h: 0, duration: 0.6, ease: 'power2.in', onUpdate: unrollDraw }, 0.05)
      .add(() => { unMat.map = flagTexture('ir'); unMat.needsUpdate = true; }, 0.7)
      .to(unroll, { h: 1, duration: 1.0, ease: 'bounce.out', onUpdate: unrollDraw }, 0.75)
      .add(() => { clothReset('ir'); roll.visible = false; unroll.h = 0; shown = 'ir'; }, 1.8);
  }
}
document.querySelectorAll('.bar button').forEach((b) => b.addEventListener('click', () => to(b.dataset.st)));
document.getElementById('dest').addEventListener('change', (e) => { dest = e.target.value; flagTexture(dest); });
flagTexture(dest);

/* ------------------------------------------------------------------ frames */
function layout() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // keep the whole gate in a tall window
  camera.fov = w / h < 0.75 ? 58 : 40;
  camera.updateProjectionMatrix();
}
addEventListener('resize', layout); layout();
const hemi = new T.HemisphereLight(0x8a7a6a, 0x0a0606, 0.75); scene.add(hemi);
const key = new T.DirectionalLight(0xffe2c0, 1.6); key.position.set(-3, 5, 6); scene.add(key);
const rim = new T.DirectionalLight(0xC21C2E, 1.1); rim.position.set(1, 3, -5); scene.add(rim);
let frames = 0, last = performance.now(), fps = 0, acc = 0;
const hud = document.getElementById('hud');
gsap.ticker.add((time, delta) => {
  acc += Math.min(delta, 50) / 1000;
  while (acc > 1 / 60) { clothStep(1 / 60); acc -= 1 / 60; }
  camera.position.set(view.x, view.y, view.z);
  camera.lookAt(0, view.ly, 0);
  renderer.render(scene, camera);
  frames += 1;
  const now = performance.now();
  if (now - last > 500) {
    fps = Math.round(frames * 1000 / (now - last)); frames = 0; last = now;
    const i = renderer.info.render;
    hud.textContent = `${fps} fps · ${i.triangles} tris · ${i.calls} draws · dpr ${ratio}`;
  }
});
</script>
