name: desktop release

on:
  pull_request:
    branches:
      - main
  push:
    # Windows' own tags. Android is released from android-v* tags by
    # release.yml; a shared v* would release both and collide.
    tags:
      - 'desktop-v*'
  workflow_dispatch:

# Read the repository and nothing else. This workflow runs on pull requests,
# and the build job installs packages and runs the tests: it gets no token
# that can push or publish. The two jobs that need more are at the bottom,
# run on tags only, and run nothing from the repository.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  GOST_VERSION: '3.3.0'
  GOST_ARCHIVE_SHA256: 'cc8ac946f86994a3aed47ef1f838cfb6b7649d9245c91fcb9899654b33d61170'
  SINGBOX_VERSION: '1.14.4'
  SINGBOX_ARCHIVE_SHA256: '99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df'
  # The Configs section's second carrier, for xhttp. The digest is the one
  # Xray publishes beside the archive (Xray-windows-64.zip.dgst, SHA2-256).
  XRAY_VERSION: '26.10.31'
  XRAY_ARCHIVE_SHA256: '2e04a9995a6f2ad1b28c0bb25c708ecb2695e43a1c9c7889c4b6ac2b48cf7a6a'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-desktop-build.lock.txt

      # The lock names every package that ends up in the exe, the ones the
      # four in requirements-desktop-build.txt pull in included, each with
      # its hashes; pip refuses anything else. Made for Windows x64 and the
      # Python above. After changing the .txt, write it again there:
      #   pip-compile --generate-hashes --allow-unsafe --strip-extras
      #     --no-emit-index-url -o requirements-desktop-build.lock.txt
      #     requirements-desktop-build.txt
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-desktop-build.lock.txt

      - name: Fetch the pinned tunnel client
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gost.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'gost'
          $url = "https://github.com/go-gost/gost/releases/download/v$env:GOST_VERSION/gost_$env:GOST_VERSION`_windows_amd64.zip"
          Invoke-WebRequest -UseBasicParsing $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:GOST_ARCHIVE_SHA256) {
            throw "gost checksum mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $exe = Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter gost.exe | Select-Object -First 1
          if (-not $exe) { throw 'gost.exe was not present in the verified archive' }
          Copy-Item -LiteralPath $exe.FullName -Destination tunnel/gost.exe

      - name: Fetch the pinned TUN engine
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'sing-box.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'sing-box'
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$env:SINGBOX_VERSION/sing-box-$env:SINGBOX_VERSION-windows-amd64.zip"
          Invoke-WebRequest -UseBasicParsing $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SINGBOX_ARCHIVE_SHA256) {
            throw "sing-box checksum mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $exe = Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter sing-box.exe | Select-Object -First 1
          if (-not $exe) { throw 'sing-box.exe was not present in the verified archive' }
          Copy-Item -LiteralPath $exe.FullName -Destination tunnel/sing-box.exe
          # GPL-3.0: the licence goes out with the binary.
          $license = Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter LICENSE | Select-Object -First 1
          if (-not $license) { throw 'sing-box LICENSE was not present in the verified archive' }
          Copy-Item -LiteralPath $license.FullName -Destination tunnel/sing-box-LICENSE.txt

      - name: Fetch the pinned Xray
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'xray.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'xray'
          $url = "https://github.com/XTLS/Xray-core/releases/download/v$env:XRAY_VERSION/Xray-windows-64.zip"
          Invoke-WebRequest -UseBasicParsing $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:XRAY_ARCHIVE_SHA256) {
            throw "Xray checksum mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $exe = Get-ChildItem -LiteralPath $unpacked -File -Filter xray.exe | Select-Object -First 1
          if (-not $exe) { throw 'xray.exe was not present in the verified archive' }
          Copy-Item -LiteralPath $exe.FullName -Destination tunnel/xray.exe
          # MPL-2.0: the licence goes out with the binary.
          $license = Join-Path $unpacked 'LICENSE'
          if (-not (Test-Path -LiteralPath $license)) { throw 'Xray LICENSE was not present in the verified archive' }
          Copy-Item -LiteralPath $license -Destination tunnel/xray-LICENSE.txt

      - name: Test
        shell: pwsh
        run: |
          python -m compileall -q app core
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed' }
          # Found, not listed: a list goes stale the day a test is added,
          # and a test nobody runs is how app/windscribe-test.py went
          # unnoticed. Every one of them has to run offline.
          $tests = @(
            Get-ChildItem -Path app, core -File -Filter '*.py' |
              Where-Object { $_.Name -like '*-test.py' -or $_.Name -like 'test_*.py' } |
              Sort-Object FullName |
              ForEach-Object { "$($_.Directory.Name)/$($_.Name)" }
          )
          # A pattern that stops matching must not pass as "all tests green".
          if ($tests.Count -lt 13) {
            throw "Expected at least 13 test files under app/ and core/, found $($tests.Count)"
          }
          Write-Host "Running $($tests.Count) test files: $($tests -join ', ')"
          foreach ($test in $tests) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

      - name: Build the public desktop bundle
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/desktop-v*') {
            $env:MIRAGE_VERSION = $env:GITHUB_REF_NAME
          } else {
            $env:MIRAGE_VERSION = "0.0.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          python app/build.py --public-release

      - name: Inspect and package the built app
        shell: pwsh
        run: |
          $out = Resolve-Path 'release-build/dist/Mirage'
          $required = @(
            'Mirage.exe', 'gost.exe', 'install-server.sh', 'README.md',
            'sing-box.exe', 'sing-box-LICENSE.txt',
            'xray.exe', 'xray-LICENSE.txt',
            'Sweep-OvpnExits.ps1', 'Resolve-OvpnRemote.ps1',
            'servers/lt-vno.prod.surfshark.com_tcp_62.197.149.105.ovpn',
            'servers/tr-ist.ws.tr-022.totallyacdn.com_149.50.208.46.ovpn',
            '_internal/ui/index.html', '_internal/ui/app.js',
            '_internal/ui/app.css', '_internal/ovpn-proxy.py'
          )
          $missing = @($required | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $out $_) -PathType Leaf)
          })
          if ($missing) {
            throw "Required release files are missing: $($missing -join ', ')"
          }

          $forbidden = @('.env', '.ovpn-auth', '.windscribe-auth', '.state', 'accounts.json', 'settings.json', 'windscribe.json')
          $leaks = Get-ChildItem -LiteralPath $out -Recurse -Force | Where-Object { $forbidden -contains $_.Name }
          if ($leaks) { throw "Private/runtime files found: $($leaks.FullName -join ', ')" }

          $starters = @(Get-ChildItem -LiteralPath (Join-Path $out 'servers') -File -Filter '*.ovpn')
          if ($starters.Count -ne 10) { throw "Expected 10 public starters, found $($starters.Count)" }

          # Launch the frozen program itself. Source-level tests cannot catch a
          # module omitted by PyInstaller from a dynamically loaded data file.
          $process = Start-Process -FilePath (Join-Path $out 'Mirage.exe') `
            -ArgumentList '--selftest' -PassThru -WindowStyle Hidden
          try {
            Wait-Process -Id $process.Id -Timeout 30 -ErrorAction Stop
          } catch {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Frozen Mirage self-test did not exit within 30 seconds'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            throw "Frozen Mirage self-test failed with exit code $($process.ExitCode)"
          }

      - name: Package the release bundle
        shell: pwsh
        run: |
          $root = (Resolve-Path 'release-build/dist/Mirage').Path
          if ($env:GITHUB_REF -like 'refs/tags/desktop-v*') {
            $label = $env:GITHUB_REF_NAME
          } else {
            $label = "build-$env:GITHUB_RUN_NUMBER"
          }
          $name = "Mirage-windows-x64-$label.zip"
          New-Item -ItemType Directory -Force release-out | Out-Null
          Compress-Archive -Path "$root/*" -DestinationPath "release-out/$name" -CompressionLevel Optimal
          $hash = (Get-FileHash "release-out/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii "release-out/$name.sha256"

      # A build that is not a release keeps its ZIP as an artifact, to try
      # out. The artifact store has a monthly allowance; once it is used up,
      # this step fails for the rest of the month, and that must not turn a
      # passing build red.
      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mirage-windows-x64
          path: |
            release-out/Mirage-windows-x64-*.zip
            release-out/Mirage-windows-x64-*.zip.sha256
          if-no-files-found: error
          # A week, then gone. Releases keep their own copies.
          retention-days: 7

      # A release hands its ZIP to the two jobs below through the Actions
      # cache instead: the cache has an allowance of its own (10 GB a
      # repository), so a full artifact store cannot hold a release up. The
      # key is this run's id, only this step writes it, and a tag's cache is
      # seen only by runs of that tag. The two jobs on Linux read what this
      # job wrote on Windows, hence enableCrossOsArchive on both sides.
      - name: Keep the release for the publish job
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release-out
          key: mirage-windows-x64-${{ github.run_id }}
          enableCrossOsArchive: true

  # Says, in a form GitHub signs and anybody can check, that this ZIP was
  # built by this workflow from this commit:
  #   gh attestation verify Mirage-windows-x64-<tag>.zip --repo <owner>/<repo>
  # The .sha256 beside the ZIP says the download is whole; this says where it
  # came from. A job of its own, so the token that can sign is not in the job
  # that runs pip and the tests. Attestations need a public repository (or
  # an Enterprise plan), so a private one skips this and still publishes.
  attest:
    if: startsWith(github.ref, 'refs/tags/desktop-v') && !github.event.repository.private
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release-out
          key: mirage-windows-x64-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-out/Mirage-windows-x64-*.zip

  # The only job that can write to the repository. It runs on tags, after the
  # build passed, and runs nothing from the tree: it picks up the two files
  # the build made and attaches them.
  publish:
    if: >-
      always() && startsWith(github.ref, 'refs/tags/desktop-v')
      && needs.windows.result == 'success'
      && (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    needs: [windows, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release-out
          key: mirage-windows-x64-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: >-
            Windows x64 portable desktop build. Extract the whole ZIP before running Mirage.exe.
            The bundle includes credential-free starter servers for Surfshark and Windscribe;
            add your own provider account in the app. Mirage stores accounts, settings and server
            data under %LOCALAPPDATA%\Mirage (an earlier version's %LOCALAPPDATA%\Relay is
            moved there on first run), so it can run from Program Files without
            Administrator access. Existing data beside the EXE is imported on first run. Accounts
            and credentials are not included in the download. This executable is not code-signed,
            so Windows may show a SmartScreen warning. Verify the accompanying SHA-256 file before
            running it.
        run: |
          zip="release-out/Mirage-windows-x64-${GITHUB_REF_NAME}.zip"
          test -f "$zip" && test -f "$zip.sha256"
          # The ZIP that arrived is the one the build hashed. The file was
          # written on Windows, so its line ends in a carriage return.
          ( cd release-out && tr -d '\r' < "$(basename "$zip").sha256" | sha256sum -c - )
          gh release create "$GITHUB_REF_NAME" "$zip" "$zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Mirage $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$NOTES"
