# The APK is built here rather than on a desk.
#
# Not for tidiness: the machine this repo is developed on has none of the
# toolchain, and the line it is on drops multi-hundred-megabyte downloads
# halfway through - which is the same reason the repo exists. A runner has a
# clean line and throws its copy away afterwards, so the phone build stops
# depending on which laptop is open.
#
# Everything the phone needs is pinned to something that is already pinned
# somewhere else in the tree, so there is one version of each and it is named
# twice rather than guessed at:
#
#   NDK       android/app/build.gradle.kts  ndkVersion
#   gomobile  mobile/core/go.mod's golang.org/x/mobile, via `go install`
#             with no @version - which resolves out of the build list rather
#             than off the tip of master, so the tool and the module it binds
#             are the same x/mobile.
name: android

on:
  # Every branch, not only main. The APK is the only way to find out whether
  # any of this compiles - there is no Android toolchain on the machine this
  # is written on - so a branch that cannot be built is a branch that cannot
  # be reviewed either.
  #
  # lists/ and app/countries.py are inputs to the core too - the split
  # tunnel's Iranian lists come from lists/, and mobile/tools/gen-countries.py
  # writes countries.go out of app/countries.py - so a change there is a
  # change to what the core job tests, even with nothing under mobile/ touched.
  push:
    paths:
      - 'android/**'
      - 'mobile/**'
      - 'mobile/tools/**'
      - 'lists/**'
      - 'app/countries.py'
      - 'tunnel/install-server.sh'
      - '.github/workflows/android.yml'
  # And on every pull request into main that touches the phone, so a merge
  # is never the first time the merged result is built.
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'mobile/**'
      - 'mobile/tools/**'
      - 'lists/**'
      - 'app/countries.py'
      - 'tunnel/install-server.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Build the signed release variant rather than the debug one'
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        description: >-
          Build the release variant and sign it. Needs the RELAY_KEYSTORE_B64 and
          RELAY_KEYSTORE_PASSWORD secrets (named before the app was called
          Mirage; secret names cannot be changed from here), and fails without them: a release signed
          with a runner's throwaway debug key cannot be upgraded over, and
          cannot be told apart from somebody else's build.
        type: boolean
        default: false
    secrets:
      RELAY_KEYSTORE_B64:
        required: false
      RELAY_KEYSTORE_PASSWORD:
        required: false

# Read the repository and nothing else. Nothing here publishes; release.yml
# does that in a job of its own.
permissions:
  contents: read

env:
  NDK_VERSION: '27.3.13750724'
  GO_VERSION: '1.27'
  GOVULNCHECK_VERSION: 'v1.9.0'

jobs:
  # The core on its own, and it has to pass. Its tests that reach real exits
  # on the real line skip on a runner - a stubbed certificate would prove the
  # harness works and nothing about the exits - and a skip is a pass; the
  # rest (pinning, the split, the LAN share, the server API) are ordinary
  # tests, and a failure in one of them is a reason to withhold an APK.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mobile/core/go.sum
      # Two things the core is built from are kept twice, and nothing but
      # this stops the copies drifting: the Iranian lists (lists/ for the
      # desktop, mobile/core/lists/ embedded in the phone's core) and the
      # country tables (app/countries.py, and the Go that
      # mobile/tools/gen-countries.py writes from it).
      - name: the two copies of the lists are the same
        run: |
          status=0
          for f in lists/*.txt; do
            cmp "$f" "mobile/core/lists/$(basename "$f")" || status=1
          done
          for f in mobile/core/lists/*.txt; do
            [ -f "lists/$(basename "$f")" ] || { echo "$f has no copy in lists/"; status=1; }
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::lists/ and mobile/core/lists/ differ - copy the changed .txt across"
          fi
          exit "$status"
      # The generator writes the whole file, continent tables and gofmt's
      # blank lines included, so the committed file must be exactly what it
      # writes from countries.py. Written to a temporary path (its first
      # argument), so the tree is not touched.
      - name: countries.go is what the generator writes
        run: |
          tmp=$(mktemp -d)
          python3 mobile/tools/gen-countries.py "$tmp/countries.go"
          if ! diff -u mobile/core/countries.go "$tmp/countries.go"; then
            echo "::error::mobile/core/countries.go is not what app/countries.py makes - run python mobile/tools/gen-countries.py and commit the result"
            exit 1
          fi
      # The same tags the .aar is built with (mobile/build-android.sh): the
      # Configs section's tests make Reality and Hysteria2 outbounds, which
      # sing-box only has with with_utls and with_quic.
      - name: vet
        working-directory: mobile/core
        run: go vet -tags with_gvisor,with_quic,with_utls ./...
      - name: test
        working-directory: mobile/core
        run: go test -tags with_gvisor,with_quic,with_utls ./...
      # Again under the race detector: the core is goroutines around shared
      # state (the tunnel, the LAN share, the health checks), and a data race
      # passes an ordinary run. It needs cgo, which the runner has.
      - name: test, with the race detector
        working-directory: mobile/core
        env:
          CGO_ENABLED: '1'
        run: go test -race -tags with_gvisor,with_quic,with_utls ./...
      # Known vulnerabilities in what the core actually calls - the modules
      # in go.sum and the standard library of the Go above. It reports only
      # code that is reached, so a finding is a reason to stop.
      - name: govulncheck
        working-directory: mobile/core
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          "$(go env GOPATH)/bin/govulncheck" -tags with_gvisor,with_quic,with_utls ./...

  apk:
    runs-on: ubuntu-latest
    # Beside the core job rather than after it, so a push still gets its APK
    # as fast as before; a failing core job fails the run all the same, and
    # release.yml publishes only from a run that passed.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # javac is not optional and not JAVA_HOME: gomobile compiles the Java it
      # generates by shelling out to `javac` on PATH, and without it the bind
      # runs, all four architectures compile, and it fails on the very last
      # step leaving an empty .aar behind.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mobile/core/go.sum

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools ndk;27.3.13750724'

      # No @version, and deliberately. `go install` from inside the module
      # resolves out of its build list, so gomobile is the same x/mobile the
      # bound package is compiled against. Pinning it separately is how the
      # tool and the module drift apart and the bind fails with a generated
      # file that does not match the generator.
      - name: gomobile, from the module's own x/mobile
        working-directory: mobile/core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          gomobile init

      - name: build the Go core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          mobile/build-android.sh

      # Gradle's own -Xmx8G is written for a desktop with room to spare. A
      # runner has 16 GB for everything at once, so the daemon is told to want
      # less here - the user-home file wins over the project's.
      - name: keep Gradle inside the runner
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' >> ~/.gradle/gradle.properties

      # Written out of a secret and never into the repo, because a signing key
      # in version control is a signing key everybody has. Outside the working
      # tree as well, so no `git add -A` anywhere can pick it up.
      #
      # A release without the key fails here. It used to fall back to the
      # runner's debug key - a key made fresh on every runner, so each such
      # release could not be installed over the last, and nothing marked it
      # as not ours. MIRAGE_REQUIRE_SIGNING makes Gradle refuse the same way,
      # should the key be set and still not be usable.
      #
      # Nothing goes into GITHUB_ENV here. The password used to, which handed
      # it to every step after this one; it is given to the one step that
      # signs, below, and to no other.
      - name: unpack the signing key
        if: inputs.release
        env:
          KEYSTORE_B64: ${{ secrets.RELAY_KEYSTORE_B64 }}
          HAVE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD != '' }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ "$HAVE_PASSWORD" != "true" ]; then
            echo "::error::no signing key configured (RELAY_KEYSTORE_B64 and RELAY_KEYSTORE_PASSWORD) - a release is not built without it"
            exit 1
          fi
          ( umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mirage-release.p12" )

      # The unit tests run on both paths: a release is the build that most
      # needs them, and it used to be the one that skipped them. They are the
      # debug variant's tests on both: this project generates unit-test tasks
      # for the debug build type only, and ':app:testReleaseUnitTest' does not
      # exist - which failed the first release (android-v0.3.0) after the
      # signing key had already been read correctly.
      #
      # Two steps rather than one with an `if` inside it, so that the signing
      # environment exists only where a release is being signed.
      - name: build the release APK
        if: inputs.release
        working-directory: android
        env:
          MIRAGE_KEYSTORE: ${{ runner.temp }}/mirage-release.p12
          MIRAGE_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
          # The alias inside the existing keystore, made before the rename.
          MIRAGE_KEY_ALIAS: relay
          MIRAGE_REQUIRE_SIGNING: 'true'
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: build the debug APK
        if: ${{ !inputs.release }}
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      # The key has done its job; it does not need to sit on the runner
      # while the artifact is uploaded.
      - name: remove the signing key
        if: always() && inputs.release
        run: rm -f "$RUNNER_TEMP/mirage-release.p12"

      # One name for both, because what changes between them is the build
      # type rather than what the thing is. Several APKs either way: one per
      # architecture and a universal one (android/app/build.gradle.kts).
      - name: name it
        id: apk
        run: |
          if [ "${{ inputs.release }}" = "true" ]; then
            echo "path=android/app/build/outputs/apk/release/*.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=android/app/build/outputs/apk/debug/*.apk" >> "$GITHUB_OUTPUT"
          fi
          ls -l android/app/build/outputs/apk/*/*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mirage-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          # A week, then gone: every push keeps an APK set of ~250 MB, and
          # a full store stops every build at this step. Releases keep
          # their own copies, which this does not touch.
          retention-days: 7
