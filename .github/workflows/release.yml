# A tag becomes something a phone can download.
#
# The point of this file is its last step: an APK attached to a
# release has a plain URL, and a plain URL is the whole of the install path on
# a phone with no cable near it. Everything above them is the android
# workflow, called rather than copied, so the release build and the build that
# runs on every push are the same build.
name: release

on:
  push:
    # Android's own tags. The Windows app is released from desktop-v* tags
    # by desktop-release.yml; one shared v* would release both at once, and
    # the second to finish would find its release already taken.
    tags: ['android-v*']

# Nothing by default; each job is given what it needs and no more. Only
# publish writes, and it runs nothing from the repository - it attaches a
# file the build made.
permissions: {}

jobs:
  # The tag names the version the phone will show, so it has to be the one
  # the build carries: android-v0.2.0 releases versionName 0.2.0 or nothing.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # All of history and every tag: the second check reads build.gradle.kts
      # as it was at each earlier release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag matches versionName
        run: |
          want="${GITHUB_REF_NAME#android-v}"
          have=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          echo "tag $want, build.gradle.kts $have"
          test "$want" = "$have"

      # versionCode is the number Android compares, and it is edited by hand.
      # An APK whose code is not above the installed one's is refused by the
      # phone as a downgrade, whatever its name says - so it has to be above
      # that of every release already out.
      - name: versionCode is above every earlier release
        run: |
          code_in() { sed -n 's/^ *versionCode = \([0-9][0-9]*\).*/\1/p' | head -n1; }
          have=$(code_in < android/app/build.gradle.kts)
          case $have in ''|*[!0-9]*) echo "::error::no versionCode found in android/app/build.gradle.kts"; exit 1 ;; esac
          max=0; from=''
          for t in $(git tag --list 'android-v*'); do
            [ "$t" = "$GITHUB_REF_NAME" ] && continue
            c=$(git show "$t:android/app/build.gradle.kts" 2>/dev/null | code_in)
            case $c in ''|*[!0-9]*) continue ;; esac
            if [ "$c" -gt "$max" ]; then max=$c; from=$t; fi
          done
          echo "versionCode $have; highest earlier release: ${from:-none} ($max)"
          if [ "$have" -le "$max" ]; then
            echo "::error::versionCode $have is not above $max ($from) - raise it in android/app/build.gradle.kts"
            exit 1
          fi

  # The called workflow can have no more than this job is given: a checkout.
  build:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets: inherit

  # Says, in a form GitHub signs and anybody can check, that this APK was
  # built by this workflow from this commit:
  #   gh attestation verify relay-<tag>.apk --repo <owner>/<repo>
  # Its own job, so the token that can sign is held by nothing that builds.
  # Attestations need a public repository (or an Enterprise plan); a private
  # one skips this and still publishes.
  attest:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relay-apk
          path: apk

      - name: name it after the tag
        run: mv apk/*.apk "relay-${GITHUB_REF_NAME}.apk"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: relay-${{ github.ref_name }}.apk

  # The only job that writes. It runs nothing from the repository - it
  # attaches a file the build made.
  publish:
    if: >-
      always() && needs.build.result == 'success'
      && (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A called workflow's artifacts belong to this run, so they are here to
      # be picked up rather than fetched across runs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relay-apk
          path: apk

      # Named for the tag. Four downloads deep in a phone's folder, three
      # files called app-debug.apk are three files nobody can tell apart.
      - name: name it after the tag
        run: |
          mv apk/*.apk "relay-${GITHUB_REF_NAME}.apk"
          sha256sum "relay-${GITHUB_REF_NAME}.apk" > "relay-${GITHUB_REF_NAME}.apk.sha256"

      # gh, which the runner already has, rather than somebody's action: the
      # step that holds the write token runs no third-party code.
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            On the phone: download, allow this browser to install unknown
            apps, open it. Configs and the sign-in go in from inside the app;
            no cable is needed.

            Signed with this repository's release key; a release is not
            built without it. A build signed with a different key cannot be
            installed over this one; it has to be uninstalled first, and that
            takes the pinned folder with it.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "relay-${GITHUB_REF_NAME}.apk" "relay-${GITHUB_REF_NAME}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES"
